
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Asmaa</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Georgia, serif;
  background: linear-gradient(135deg, #1b1025, #50264f, #e6a6b7);
  color: white;
  text-align: center;
}

.container {
  width: 100%;
  padding: 20px;
  position: relative;
  z-index: 2;
}

h1 {
  color: #ffe1a8;
  font-size: clamp(30px, 8vw, 45px);
  text-shadow: 0 0 20px #ff9fc8;
  animation: glow 2s infinite alternate;
}

.subtitle {
  font-size: 18px;
  color: #ffe6f0;
}

button {
  border: 1px solid #ffe1a8;
  background: linear-gradient(135deg, #e9a8c1, #a95183);
  color: white;
  padding: 15px 30px;
  font-size: 20px;
  border-radius: 35px;
  cursor: pointer;
  box-shadow: 0 0 20px #ffb4d4;
  margin-top: 25px;
}

button:active {
  transform: scale(.95);
}

#birthday {
  display: none;
  animation: appear 1.2s ease forwards;
}

.cake {
  font-size: 115px;
  margin: 20px 0;
  animation: bounce 2s infinite;
  filter: drop-shadow(0 0 20px #ffc5df);
}

.message {
  font-size: 20px;
  line-height: 1.8;
  color: #fff0f6;
}

.heart {
  position: absolute;
  bottom: -40px;
  animation: floatUp linear forwards;
  pointer-events: none;
  z-index: 1;
}

#candles {
  font-size: 30px;
  cursor: pointer;
  margin-bottom: -25px;
  position: relative;
  z-index: 3;
}

@keyframes glow {
  from { text-shadow: 0 0 8px #ff9fc8; }
  to { text-shadow: 0 0 25px #ffe1a8; }
}

@keyframes appear {
  from { opacity: 0; transform: scale(.7); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container" id="intro">
  <div style="font-size:65px">🎁</div>
  <h1>A Little Surprise</h1>
  <p class="subtitle">Something special is waiting for you...</p>
  <button onclick="openBirthday()">اضغطي هنا 💗</button>
</div>

<div class="container" id="birthday">
  <div style="font-size:40px">✨ 💗 ✨</div>

  <h1>HAPPY BIRTHDAY<br>ASMAA</h1>

  <p class="message">
    Today is all about you! 🌸<br>
    May your life be full of love,<br>
    happiness and beautiful memories.
  </p>

  <div id="candles" onclick="blowCandles()">
    🕯️ 🕯️ 🕯️
  </div>

  <div class="cake">🎂</div>

  <p id="wish" class="message">
    Make a wish and blow the candles! 💫
  </p>
</div>

<script>
function openBirthday() {
  document.getElementById("intro").style.display = "none";
  document.getElementById("birthday").style.display = "block";

  for (let i = 0; i < 35; i++) {
    setTimeout(createHeart, i * 120);
  }
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";

  const emojis = ["💗", "💕", "✨", "💖", "🌸", "🎉"];
  heart.innerText = emojis[
    Math.floor(Math.random() * emojis.length)
  ];

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (18 + Math.random() * 22) + "px";
  heart.style.animationDuration = (4 + Math.random() * 5) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 9000);
}

function blowCandles() {
  document.getElementById("candles").innerText = "✨ 💨 ✨";
  document.getElementById("wish").innerText =
    "Your wish deserves to come true! 💗🎉";
}

setInterval(() => {
  if (document.getElementById("birthday").style.display === "block") {
    createHeart();
  }
}, 700);
</script>

</body>
</html>
